name: Run Telegram Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        pip install -r requirements.txt

    - name: 🔐 Set environment variables
      run: |
        echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
        echo "LOG_CHANNEL_ID=${{ secrets.LOG_CHANNEL_ID }}" >> .env
        echo "ADMIN_USER_ID=${{ secrets.ADMIN_USER_ID }}" >> .env
        echo "HAPPYHUB_API_URL=${{ secrets.HAPPYHUB_API_URL }}" >> .env
        echo "HAPPYHUB_EMAIL=${{ secrets.HAPPYHUB_EMAIL }}" >> .env
        echo "HAPPYHUB_PASSWORD=${{ secrets.HAPPYHUB_PASSWORD }}" >> .env

    - name: ▶️ Run Bot
      run: |
        python my_bot.py