name: Telegram Bot CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        pip install -r requirements.txt

    - name: 🧪 Verify Python Code Syntax
      run: |
        python -m py_compile my_bot.py
        python -m py_compile bot_download.py

    - name: ▶️ Run Bot (Manual Dispatch Only)
      if: ${{ github.event_name == 'workflow_dispatch' && secrets.BOT_TOKEN != '' }}
      run: |
        echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
        echo "LOG_CHANNEL_ID=${{ secrets.LOG_CHANNEL_ID }}" >> .env
        echo "ADMIN_USER_ID=${{ secrets.ADMIN_USER_ID }}" >> .env
        echo "HAPPYHUB_API_URL=${{ secrets.HAPPYHUB_API_URL }}" >> .env
        echo "HAPPYHUB_EMAIL=${{ secrets.HAPPYHUB_EMAIL }}" >> .env
        echo "HAPPYHUB_PASSWORD=${{ secrets.HAPPYHUB_PASSWORD }}" >> .env
        python my_bot.py